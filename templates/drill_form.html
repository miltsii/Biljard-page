{% extends "layout.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>

{% include "_errors.html" %}

<form action="" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="title">Otsikko</label>
  <input type="text" id="title" name="title" value="{{ title }}" maxlength="100" required>

  <label for="description">Kuvaus (miten harjoitus tehdään ja miten pisteet lasketaan)</label>
  <textarea id="description" name="description" rows="8" maxlength="5000" required>{{ description }}</textarea>

  <p>Luokat:</p>
  {% for category in categories %}
    <label class="inline">
      <input type="checkbox" name="categories" value="{{ category.id }}"
             {% if category.id in chosen %}checked{% endif %}>
      {{ category.name }}
    </label>
  {% endfor %}

  <br>
  <button type="submit">Tallenna</button>
</form>
{% endblock %}
