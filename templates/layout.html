<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Biljardiharjoitukset{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <a class="logo" href="{{ url_for('index') }}">Biljardiharjoitukset</a>

  <form action="{{ url_for('search') }}" method="get">
    <input type="text" name="q" maxlength="100" placeholder="Hae harjoituksia">
    <button type="submit">Hae</button>
  </form>

  <nav>
    {% if current_user %}
      <a href="{{ url_for('new_drill') }}">Uusi harjoitus</a>
      <a href="{{ url_for('user_page', user_id=current_user_id) }}">{{ current_user }}</a>
      <form action="{{ url_for('logout') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="linkbutton">Kirjaudu ulos</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Kirjaudu</a>
      <a href="{{ url_for('register') }}">Rekisteröidy</a>
    {% endif %}
  </nav>
</header>

<main>
  {% for message in get_flashed_messages() %}
    <p class="message">{{ message }}</p>
  {% endfor %}

  {% block content %}{% endblock %}
</main>

</body>
</html>
