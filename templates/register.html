
{% extends "layout.html" %}

{% block title %}
Rekisteröidy
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Rekisteröidy</h1>

    <p>
        Luo tunnus, jotta voit julkaista ja kommentoida.
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST"
          action="{{ url_for('register') }}">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}">


        <label for="username">
            Käyttäjänimi
        </label>

        <input
            type="text"
            id="username"
            name="username"
            maxlength="30"
            required
        >


        <label for="password1">
            Salasana
        </label>

        <input
            type="password"
            id="password1"
            name="password1"
            minlength="6"
            required
        >


        <label for="password2">
            Salasana uudelleen
        </label>

        <input
            type="password"
            id="password2"
            name="password2"
            minlength="6"
            required
        >


        <button type="submit">
            Rekisteröidy
        </button>

    </form>


    <p class="form-footer">
        Onko sinulla jo tunnus?

        <a href="{{ url_for('login') }}">
            Kirjaudu sisään
        </a>
    </p>

</div>

{% endblock %}
