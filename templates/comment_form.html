{% extends "layout.html" %}
{% block title %}Muokkaa kommenttia{% endblock %}
{% block content %}
<h1>Muokkaa kommenttia</h1>
{% include "_errors.html" %}
<form class="stack" action="{{ url_for('edit_comment', comment_id=comment.id) }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Kommentti <textarea name="body" rows="4" maxlength="1000" required>{{ body }}</textarea></label>
  <button type="submit">Tallenna</button>
</form>
{% endblock %}
