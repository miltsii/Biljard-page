{% extends "layout.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
{% include "_errors.html" %}
<form class="stack" action="{{ action }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Otsikko <input name="title" value="{{ title }}" maxlength="100" required></label>
  <label>Sisältö <textarea name="body" rows="8" maxlength="5000" required>{{ body }}</textarea></label>
  <fieldset>
    <legend>Aihealueet</legend>
    {% for c in categories %}
      <label class="check"><input type="checkbox" name="categories" value="{{ c.id }}"
        {% if c.id in chosen %}checked{% endif %}> {{ c.name }}</label>
    {% endfor %}
  </fieldset>
  <button type="submit">Tallenna</button>
</form>
{% endblock %}
